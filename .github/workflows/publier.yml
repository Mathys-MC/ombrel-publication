concurrency:
  group: publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Paris
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements.txt
      - run: python3 publier.py
      - name: Enregistrer les statuts
        if: always()
        run: |
          git config user.name "publication-ombrel"
          git config user.email "publication-ombrel@users.noreply.github.com"
          git add lots
          git diff --cached --quiet && exit 0
          git commit -q -m "Publication $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
