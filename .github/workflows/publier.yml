name: Publication organique
# Généré par 04-scripts-python/organique_cloud_sync.py — ne pas modifier à la main.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
    - cron: '23 7 * * *'
    - cron: '46 7 * * *'
    - cron: '9 8 * * *'
    - cron: '23 8 25 10 *'
    - cron: '32 8 * * *'
    - cron: '55 8 * * *'
    - cron: '9 9 26 10 *'
    - cron: '18 9 * * *'
    - cron: '41 9 * * *'
    - cron: '4 10 * * *'
    - cron: '28 10 * * *'
    - cron: '51 10 * * *'
    - cron: '14 11 * * *'
    - cron: '37 11 * * *'
    - cron: '0 12 * * *'
    - cron: '14 12 25 10 *'
    - cron: '23 12 * * *'
    - cron: '46 12 * * *'
    - cron: '9 13 * * *'
    - cron: '32 13 * * *'
    - cron: '55 13 * * *'
    - cron: '18 14 * * *'
    - cron: '41 14 * * *'
    - cron: '4 15 * * *'
    - cron: '27 15 * * *'
    - cron: '50 15 * * *'
    - cron: '4 16 25 10 *'
    - cron: '13 16 * * *'
    - cron: '36 16 * * *'
    - cron: '59 16 * * *'
    - cron: '22 17 * * *'
    - cron: '46 17 * * *'
    - cron: '9 18 * * *'
    - cron: '32 18 * * *'
    - cron: '55 18 * * *'
    - cron: '18 19 * * *'
    - cron: '32 19 25 10 *'
    - cron: '41 19 * * *'
    - cron: '4 20 * * *'
    - cron: '27 20 * * *'
    - cron: '50 20 * * *'
concurrency:
  group: publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Europe/Paris
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
    steps:
      # ref: main → l'état le plus récent au moment où le passage démarre (sans ça, un passage mis en attente
      # repartait de l'état d'avant le passage précédent et republiait les mêmes posts : 3 doublons le 2026-10-06)
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q -r requirements.txt
      - run: git pull -q --rebase origin main && python3 publier.py
      - name: Enregistrer les statuts
        if: always()
        run: |
          git config user.name "publication-ombrel"
          git config user.email "publication-ombrel@users.noreply.github.com"
          git add lots
          git diff --cached --quiet && exit 0
          git commit -q -m "Publication $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
